name: OrkiLab foundation checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'orkilab/**']
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Benchmark reports are Flask routes; keep this CPU-only and lightweight.
      - name: Install CPU-only test dependencies
        run: python -m pip install flask psutil requests pillow
      - run: python -m unittest discover -s tests -v
