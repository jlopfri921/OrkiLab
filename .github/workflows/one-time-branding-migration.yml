name: One-time OrkiLab branding migration
on:
  push:
    branches:
      - fix/branding-remove-arkilab-references

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'jlopfri921/OrkiLab-LoRA-TrainerStudio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/branding-remove-arkilab-references
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rename legacy source names and paths
        run: python scripts/rename_branding.py --apply
      - name: Verify patch and push to PR branch
        run: |
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(branding): rewrite legacy names and paths to OrkiLab"
            git push origin HEAD:fix/branding-remove-arkilab-references
          fi
